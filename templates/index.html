<!DOCTYPE html>
<html lang="en">
<head>
  <title>Ernakulam Urban Risk Dashboard</title>
  <meta charset="utf-8" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --muted: #6b7280;
      --text: #111827;
      --border: #e5e7eb;
      --accent: #2563eb;
    }

    body.dark {
      --bg: #0b1220;
      --panel: #111827;
      --muted: #9ca3af;
      --text: #e5e7eb;
      --border: #1f2937;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* HEADER */
    .header {
      height: 56px;
      background: linear-gradient(90deg, #0f172a, #1e293b);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .header h1 {
      font-size: 17px;
      margin: 0;
      font-weight: 700;
    }

    .toggle {
      cursor: pointer;
      font-size: 14px;
      opacity: 0.85;
    }

    .toggle:hover { opacity: 1; }

    /* LAYOUT */
    .container {
      display: flex;
      height: calc(100vh - 56px);
    }

    /* SIDEBAR */
    .sidebar {
      width: 300px;
      background: var(--panel);
      padding: 14px;
      box-shadow: 2px 0 12px rgba(0,0,0,0.15);
      overflow-y: auto;
    }

    .card {
      background: var(--panel);
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      transition: box-shadow 0.25s ease;
    }

    .card:hover {
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    /* COLLAPSIBLE HEADER */
    .card-header {
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
    }

    .card-header span {
      transition: transform 0.25s ease;
    }

    .card.collapsed .card-header span {
      transform: rotate(-90deg);
    }

    .card-content {
      padding: 14px;
      max-height: 600px;
      transition: max-height 0.35s ease, opacity 0.25s ease;
    }

    .card.collapsed .card-content {
      max-height: 0;
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    /* INFO ROWS */
    .info-row {
      margin-bottom: 10px;
      font-size: 13px;
    }

    .info-label {
      color: var(--muted);
      font-size: 12px;
    }

    .info-value {
      font-weight: 600;
      margin-top: 2px;
    }

    /* RISK BADGES */
    .risk-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .risk-animate {
      animation: pulse 0.6s ease;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.4; }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .risk-low { background: #14532d; color: #dcfce7; }
    .risk-moderate { background: #854d0e; color: #fef9c3; }
    .risk-high { background: #7f1d1d; color: #fee2e2; }
    .risk-very-high { background: #450a0a; color: #fecaca; }

    /* MAP */
    #map {
      flex: 1;
    }

    /* CONTROLS */
    .control {
      position: absolute;
      right: 20px;
      z-index: 1200;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    #modeSelect { top: 72px; }
    #timeSelect { top: 118px; }

    /* LEGEND */
    .legend {
      position: absolute;
      left: 20px;
      bottom: 20px;
      z-index: 1300;
      background: var(--panel);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .legend .bar {
      height: 10px;
      border-radius: 6px;
      background: linear-gradient(90deg,#313695,#2b83ba,#7ad151,#fee08b,#f46d43,#d73027);
      margin-bottom: 6px;
    }

    .legend .labels {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
    }

    .note {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1>Ernakulam Urban Risk Dashboard</h1>
  <div class="toggle" onclick="toggleDark()">🌙 Dark mode</div>
</div>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="card">
      <div class="card-header" onclick="toggleCard(this)">
        Area Insights <span>▾</span>
      </div>
      <div class="card-content">
        <div class="info-row">
          <div class="info-label">Location</div>
          <div class="info-value" id="info-location">Click on map</div>
        </div>

        <div class="info-row">
          <div class="info-label">Temperature</div>
          <div class="info-value" id="info-temp">—</div>
        </div>

        <div class="info-row">
          <div class="info-label">Risk Level</div>
          <div class="info-value">
            <span id="info-risk" class="risk-badge">—</span>
          </div>
        </div>

        <div class="info-row">
          <div class="info-label">Why this area?</div>
          <div class="info-value" id="info-reason">—</div>
        </div>
      </div>
    </div>

    <div class="card collapsed">
      <div class="card-header" onclick="toggleCard(this)">
        Methodology <span>▾</span>
      </div>
      <div class="card-content">
        <div class="note">
          Temperature from ERA5 reanalysis, spatial interpolation.
          Traffic uses congestion proxy points for activity intensity.
        </div>
      </div>
    </div>

  </div>

  <!-- MAP -->
  <div id="map"></div>

  <div class="legend">
    <div class="bar"></div>
    <div class="labels">
      <span>26°C</span><span>29°C</span><span>32°C</span><span>35°C</span><span>38°C</span>
    </div>
  </div>

</div>

<select id="modeSelect" class="control">
  <option selected>🌡 Temperature</option>
  <option>🚦 Traffic</option>
</select>

<select id="timeSelect" class="control">
  <option>Morning</option>
  <option selected>Afternoon</option>
</select>

<!-- SCRIPTS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
<script src="/static/map.js"></script>

<script>
  /* DARK MODE */
  function toggleDark() {
    document.body.classList.toggle("dark");
  }

  /* COLLAPSIBLE PANELS */
  function toggleCard(el) {
    el.parentElement.classList.toggle("collapsed");
  }

  /* RISK ANIMATION (call this on map click) */
  function updateRisk(text, level) {
    const el = document.getElementById("info-risk");
    el.className = "risk-badge risk-" + level + " risk-animate";
    el.textContent = text;
    setTimeout(() => el.classList.remove("risk-animate"), 600);
  }

  /* Example hook — call from map.js */
  // updateRisk("High", "high");
</script>

</body>
</html>
